x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"
    mode: "non-blocking"

services:
  frontend:
    image: ghcr.io/use-tusk/tusk-frontend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx_secrets:/etc/letsencrypt
    depends_on: ["backend"]
    logging: *logging

  backend:
    image: ghcr.io/use-tusk/tusk-backend:latest
    env_file: .env
    logging: *logging
    depends_on: &backend_depends_on
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=onprem
      - GAE_SERVICE=user

  default:
    image: ghcr.io/use-tusk/tusk-backend:latest
    env_file: .env
    logging: *logging
    depends_on:
      <<: *backend_depends_on
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=onprem
      - GAE_SERVICE=default

  runs:
    image: ghcr.io/use-tusk/tusk-backend:latest
    env_file: .env
    logging: *logging
    depends_on:
      <<: *backend_depends_on
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=onprem
      - GAE_SERVICE=runs

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tusk
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres", "-d", "tusk"]
      interval: 1s
      timeout: 5s
      retries: 10


volumes:
  db:
    driver: local
  nginx_secrets:

networks: 
  default:
    driver: bridge
